<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Image Gallery</h1>

    <!-- Category Buttons -->
    <div class="filter-buttons">
        <button class="active" data-filter="all">All</button>
        <button data-filter="nature">Nature</button>
        <button data-filter="city">City</button>
        <button data-filter="animals">Animals</button>
    </div>


    <!-- Image Gallery -->
    <div class="gallery">

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/10/600/400" alt="Nature">
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1011/600/400" alt="City">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1015/600/400" alt="Nature">
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1031/600/400" alt="City">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/237/600/400" alt="Animal">
        </div>

        

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1043/600/400" alt="Nature">
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1019/600/400" alt="City">
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1074/600/400" alt="Animal">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1040/600/400" alt="Nature">
        </div>

        <div class="gallery-item city">
           <img src="https://picsum.photos/id/1047/600/400" alt="City">
        </div>

        <div class="gallery-item animals">
           <img src="https://picsum.photos/id/1024/600/400" alt="Animal">
        </div>

    </div>


    <!-- Lightbox -->
    <div class="lightbox">

        <span class="close">&times;</span>

        <button class="prev">&#10094;</button>

        <img class="lightbox-img" src="" alt="">

        <button class="next">&#10095;</button>

    </div>


    <script src="script.js"></script>

</body>
</html>
